<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>SCRawCheat - GTA 5 RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Arapey|Cantarell|Comfortaa|Khand|Russo+One|Ubuntu');
    </style>
</head>

<body class="sidebar-closed">
    {% block update_overlay %}{% endblock %}

    <div class="titlebar" style="background: rgba(10, 10, 10, 0.7); border-bottom: 1px solid rgba(255, 0, 0, 0.2);">
        <div class="titlebar-drag-region">
            <div class="titlebar-title" style="background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SCRawCheat</div>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn minimize-btn" onclick="minimizeWindow()" title="Свернуть" style="color: #ff0000;">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </button>
            <button class="titlebar-btn close-btn" onclick="closeWindow()" title="Закрыть" style="color: #ff0000;">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <line x1="0" y1="0" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="12" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="particles-js"></div>

    <audio id="hover-sound" src="{{ url_for('static', filename='wav/hover.wav') }}" preload="auto"></audio>
    <audio id="click-sound" src="{{ url_for('static', filename='wav/click.wav') }}" preload="auto"></audio>

    <div id="loader">
        <div class="spinner" style="border-top-color: #ff0000;"></div>
    </div>

    <div class="app-content">
        <aside class="sidebar" id="sidebar" style="background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 100%); border-right: 1px solid rgba(255, 0, 0, 0.2);">
            <div class="sidebar-header" style="border-bottom: 1px solid rgba(255, 0, 0, 0.2);">
                <button class="burger-btn" onclick="toggleSidebar()">
                    <span style="background-color: #ff0000;"></span>
                    <span style="background-color: #ff0000;"></span>
                    <span style="background-color: #ff0000;"></span>
                </button>
                <div class="nav-logo" style="background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SCRawCheat</div>
            </div>
            <nav class="nav-links">
                <div id="nav-indicator" class="nav-indicator" style="background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);"></div>
                <div class="nav-main-group">
                    <a href="/index" class="nav-item" data-tooltip="Главная">
                        <span class="icon">🏠</span>
                        <span class="text">Главная</span>
                    </a>
                    <a href="/antiafk" class="nav-item" data-tooltip="Anti-AFK">
                        <span class="icon">💤</span>
                        <span class="text">Anti-AFK</span>
                    </a>
                    <a href="/postman" class="nav-item" data-tooltip="Почтальон">
                        <span class="icon">🚚</span>
                        <span class="text">Почтальон</span>
                    </a>
                    <a href="/demorgan" class="nav-item" data-tooltip="Деморган">
                        <span class="icon">⛓️</span>
                        <span class="text">Деморган</span>
                    </a>
                    <a href="/stroyka" class="nav-item" data-tooltip="Стройка/Шахта">
                        <span class="icon">⛏️</span>
                        <span class="text">Стройка/Шахта</span>
                    </a>
                    <a href="/port" class="nav-item" data-tooltip="Порт">
                        <span class="icon">⚓</span>
                        <span class="text">Порт</span>
                    </a>
                    <a href="/cow" class="nav-item" data-tooltip="Коровы">
                        <span class="icon">🐄</span>
                        <span class="text">Коровы</span>
                    </a>
                    <a href="/gym" class="nav-item" data-tooltip="Качалка">
                        <span class="icon">🏋️</span>
                        <span class="text">Качалка</span>
                    </a>
                    <a href="/cooking" class="nav-item" data-tooltip="Кулинария">
                        <span class="icon">🍜</span>
                        <span class="text">Кулинария</span>
                    </a>
                    <a href="/taxi" class="nav-item" data-tooltip="Такси">
                        <span class="icon">🚕</span>
                        <span class="text">Такси</span>
                    </a>
                    <a href="/bonuspoint" class="nav-item" data-tooltip="Bonus Point">
                        <span class="icon">🏆</span>
                        <span class="text">Bonus Point</span>
                    </a>
                </div>
                <div class="nav-main-group">
                    <a href="/settings" class="nav-item settings-item" data-tooltip="Настройки">
                        <span class="icon">⚙️</span>
                        <span class="text">Настройки</span>
                    </a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <div id="ui-settings-data" 
         data-hover-enabled="{{ ui_sounds.switch_hover | tojson }}" 
         data-click-enabled="{{ ui_sounds.switch_click | tojson }}" 
         data-hover-vol="{{ ui_sounds.volume_hover }}" 
         data-click-vol="{{ ui_sounds.volume_click }}" 
         data-background="{{ ui_sounds.background }}"
         style="display: none;">
    </div>

    <script>
        (function() {
            const dataSource = document.getElementById('ui-settings-data');
            if (dataSource) {
                window.UI_CONFIG = {
                    hoverEnabled: dataSource.getAttribute('data-hover-enabled') === 'true',
                    clickEnabled: dataSource.getAttribute('data-click-enabled') === 'true',
                    hoverVol: parseInt(dataSource.getAttribute('data-hover-vol') || 35) / 100,
                    clickVol: parseInt(dataSource.getAttribute('data-click-vol') || 45) / 100,
                    background: dataSource.getAttribute('data-background') || 'bot'
                };
                console.log('✅ UI_CONFIG загружен:', window.UI_CONFIG);
            }
        })();
    </script>

    <script src="{{ url_for('static', filename='js/drag.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/particles.min.js') }}"></script>
    
    <script>
        window.initParticles = function(backgroundType) {
            const bg = backgroundType || (window.UI_CONFIG ? window.UI_CONFIG.background : 'bot');
            console.log('🎨 Инициализация particles с фоном:', bg);

            if (window.particlesJS && window.particlesJS.destroy) {
                window.particlesJS.destroy();
            }

            const container = document.getElementById('particles-js');
            if (container) {
                container.innerHTML = '';
            }

            let imageSrc = "{{ url_for('static', filename='icons/bot.ico') }}";
            if (bg === 'liquid') {
                imageSrc = [{
                    src: "{{ url_for('static', filename='icons/liquid1.ico') }}",
                    rotation: 0
                }, {
                    src: "{{ url_for('static', filename='icons/liquid2.ico') }}",
                    rotation: 0.02
                }];
            } else if (bg === 'chrome') {
                imageSrc = [
                    { src: "{{ url_for('static', filename='icons/chrome1.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/chrome2.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/chrome3.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/chrome4.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/chrome5.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/chrome6.ico') }}", rotation: 0 }
                ];
            } else if (bg === 'line') {
                imageSrc = [
                    { src: "{{ url_for('static', filename='icons/line1.ico') }}", rotation: 0 },
                    { src: "{{ url_for('static', filename='icons/line2.ico') }}", rotation: 0 }
                ];
            } else {
                imageSrc = "{{ url_for('static', filename='icons/bot.ico') }}";
            }

            particlesJS("particles-js", {
                particles: {
                    number: {
                        value: 52,
                        density: {
                            enable: true,
                            value_area: 631.3280775270874
                        }
                    },
                    color: {
                        value: "#fff"
                    },
                    shape: {
                        type: "image",
                        stroke: {
                            width: 0,
                            color: "#000000"
                        },
                        image: {
                            src: imageSrc,
                            width: 500,
                            height: 600
                        }
                    },
                    opacity: {
                        value: 0.5,
                        random: true,
                        anim: {
                            enable: false,
                            speed: 1,
                            opacity_min: 0.1,
                            sync: false
                        }
                    },
                    size: {
                        value: 25,
                        random: true,
                        anim: {
                            enable: false,
                            speed: 0.001,
                            size_min: 15,
                            sync: false
                        }
                    },
                    line_linked: {
                        enable: false,
                        distance: 500,
                        color: "#ffffff",
                        opacity: 0.4,
                        width: 2
                    },
                    move: {
                        enable: true,
                        speed: 1.5,
                        direction: "bottom",
                        random: false,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: {
                            enable: false,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: {
                            enable: false,
                            mode: "bubble"
                        },
                        onclick: {
                            enable: true,
                            mode: "repulse"
                        },
                        resize: true
                    },
                    modes: {
                        grab: {
                            distance: 400,
                            line_linked: {
                                opacity: 0.5
                            }
                        },
                        bubble: {
                            distance: 400,
                            size: 4,
                            duration: 0.3,
                            opacity: 1,
                            speed: 3
                        },
                        repulse: {
                            distance: 200,
                            duration: 0.4
                        },
                        push: {
                            particles_nb: 4
                        },
                        remove: {
                            particles_nb: 2
                        }
                    }
                },
                retina_detect: true
            });
        };

        window.initParticles('{{ ui_sounds.background }}');
    </script>

    <!-- ФИНАЛЬНЫЙ ФИКС ВСЕХ КАРТИНОК -->
    <script src="{{ url_for('static', filename='js/fix_all_paths.js') }}"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>

</html>
